
services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    container_name: backend
    restart: always
    env_file:
      - ./backend/.env

    depends_on:
      - redis

  frontend:
    build: ./hotelapp
    ports:
      - "5173:80"
    container_name: frontend
    restart: always

  redis:
    image: redis:8.4
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass password

